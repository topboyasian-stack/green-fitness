<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101510"><title>Green Fitness | Performance Club</title>
<style>
:root{--bg:#0d120e;--panel:#171e18;--line:#303b31;--green:#39ff14;--white:#f7fff7;--muted:#a0afa1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px/1.5 Inter,system-ui,Arial}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#111812;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px}select,input,textarea{background:#101710;color:white;border:1px solid var(--line);border-radius:9px;padding:10px;max-width:100%;width:100%}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#071007}.soft{background:#253326;color:var(--green);border:1px solid #3c5a3d}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{background:#111812;padding:14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}aside button{text-align:left;background:transparent;color:#c8d3c8}aside button.active{background:#253326;color:var(--green)}main{padding:22px;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 0}.cols{grid-template-columns:1.2fr 1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.card h3{margin:0 0 12px}.value{font-size:25px;font-weight:900;color:var(--green)}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #29332a;align-items:center}.row:last-child{border:0}.tag{font-size:10px;border-radius:20px;padding:5px 8px;background:#203d22;color:var(--green)}label{display:block;color:var(--muted);font-size:11px;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:#2b291c;border:1px solid #63542a;color:#e9d99f;padding:11px;border-radius:10px;font-size:11px;margin:12px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px}.membercard{background:linear-gradient(135deg,#183b1d,#0d1d10);border:1px solid #4c7b4b;border-radius:18px;padding:20px}.toast{position:fixed;bottom:16px;right:16px;background:var(--green);color:#071007;padding:12px;border-radius:9px;display:none;z-index:5}
@media(max-width:760px){.layout{display:flex;flex-direction:column}aside{flex-direction:row;overflow:auto;position:sticky;top:64px;padding:7px;z-index:2}aside button{white-space:nowrap;font-size:11px;padding:9px}main{padding:14px 10px 28px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:22px}}
@media(max-width:380px){header{padding:10px}.brand{font-size:12px}.brand small{font-size:8px}.stats{grid-template-columns:1fr}.card{padding:12px}}
</style></head>
<body><header><div class="brand">GREEN FITNESS<small>PERFORMANCE CLUB · IKOTUN</small></div><select id="role" aria-label="Choose dashboard" onchange="setRole(this.value)" style="width:auto"><option value="member">Member App</option><option value="trainer">Trainer Dashboard</option><option value="owner">Owner Dashboard</option><option value="wellness">Wellness & Wearables</option></select></header>
<div class="layout"><aside id="nav"></aside><main id="app"></main></div><div id="toast" class="toast"></div>
<script>
const demo={members:[{id:'GF-2401',name:'Amara James',plan:'Foundation Strength',status:'Active',trainer:'Coach Daniel',expiry:'23 Nov 2026'},{id:'GF-2402',name:'Tobi Adeyemi',plan:'Fat-loss Starter',status:'Active',trainer:'Coach Amaka',expiry:'24 Nov 2026'},{id:'GF-2403',name:'Zara Bello',plan:'Mobility & Core',status:'Renewal due',trainer:'Coach Daniel',expiry:'29 Oct 2026'}],attendance:[{name:'Amara James',time:'07:42 AM',day:'Today'}],notes:[],routines:[],meals:[],telemetry:{hr:112,steps:4200,cal:186}};
let role='member',page='home';const $=id=>document.getElementById(id);function save(){localStorage.setItem('gf-demo-v3',JSON.stringify(demo))}try{const old=JSON.parse(localStorage.getItem('gf-demo-v3'));if(old)Object.assign(demo,old)}catch(e){}
const navs={member:[['home','My membership'],['workout','My workouts'],['progress','My progress']],trainer:[['roster','Member roster'],['routine','Routine builder'],['notes','Trainer notes']],owner:[['overview','Overview'],['members','Members'],['attendance','Attendance'],['finance','Finance']],wellness:[['nutrition','Nutrition hub'],['wearables','Wearable simulator']]};
function setRole(r){role=r;page=navs[r][0][0];$('role').value=r;render()}
function go(p){page=p;render()}
function ping(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function header(t,s){return '<div class="head"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div></div>'}
function stat(t,v,s){return '<div class="card"><div class="muted">'+t+'</div><div class="value">'+v+'</div><div class="muted">'+s+'</div></div>'}
function table(rows,heads){return '<div class="card tablewrap"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){ $('nav').innerHTML=navs[role].map(([p,n])=>'<button class="'+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+n+'</button>').join('');$('app').innerHTML=views[page](); }
const views={
home:()=>header('Welcome back, Amara','Your membership at Green Fitness')+'<div class="membercard"><div class="muted">DIGITAL MEMBERSHIP CARD</div><h2>Amara James</h2><div class="row"><span>Member ID</span><b>GF-2401</b></div><div class="row"><span>Plan</span><b>Premium · Foundation Strength</b></div><div class="row"><span>Valid until</span><b>23 Nov 2026</b></div><div class="row"><span>QR check-in code</span><b>GF2401-A8F2</b></div><button class="primary" onclick="checkin()">Simulate gym check-in</button></div><div class="grid stats">'+stat('Attendance streak','4 days','Sample data')+stat('This week','3 visits','Training consistency')+stat('Membership','Active','Renewal 23 Nov')+stat('Next session','Today','Foundation strength')+'</div><div class="notice">Demo QR check-in only. This does not scan a real QR code or validate a live membership.</div>',
workout:()=>header('My workouts','Foundation strength · Coach Daniel')+'<div class="card"><h3>Today · Full body A</h3>'+[['Goblet squat','3 sets × 10 reps · RIR 2'],['Dumbbell press','3 sets × 10 reps · RIR 2'],['Seated row','3 sets × 12 reps · RIR 2'],['Plank','3 sets × 30 seconds']].map(x=>'<div class="row"><span>'+x[0]+'<div class="muted">'+x[1]+'</div></span><input type="checkbox" style="width:22px" aria-label="Complete '+x[0]+'"></div>').join('')+'</div>',
progress:()=>header('My progress','Track consistency and personal milestones')+'<div class="grid stats">'+stat('Current weight','67.5 kg','Fictional sample')+stat('Weekly sessions','3 / 4','Target')+stat('Streak','4 days','Sample')+stat('Goal','Build strength','Member-set goal')+'</div><div class="card"><h3>Recent activity</h3>'+demo.attendance.map(a=>'<div class="row">'+a.day+' · '+a.time+'<span class="tag">Checked in</span></div>').join('')+'</div>',
roster:()=>header('Trainer roster','Assigned members · sample records')+'<div class="grid stats">'+stat('Assigned members','3','Demo roster')+stat('Weekly compliance','82%','Illustrative')+stat('Check-ins today',demo.attendance.length,'Shared log')+stat('Notes saved',demo.notes.length,'Trainer notes')+'</div>'+table(demo.members.map(m=>[m.name,m.plan,m.trainer,m.expiry,m.status]),['MEMBER','PLAN','TRAINER','RENEWAL','STATUS']),
routine:()=>header('Routine builder','Create a workout and add it to the shared demo plan library')+'<div class="grid cols"><div class="card"><h3>New routine</h3><label>Member</label><select id="rMember">'+demo.members.map(m=>'<option>'+m.name+'</option>').join('')+'</select><label>Routine name</label><input id="rName" placeholder="Upper body strength"><label>Exercise</label><input id="rExercise" placeholder="Dumbbell press"><label>Sets × reps</label><input id="rSets" placeholder="3 × 10"><label>Intensity / RIR</label><input id="rRir" placeholder="RIR 2"><button class="primary" onclick="addRoutine()">Save routine</button></div><div class="card"><h3>Saved routines</h3>'+demo.routines.map(r=>'<div class="row"><b>'+r.name+'</b><span>'+r.exercise+' · '+r.sets+'</span></div>').join('')+'</div></div>',
notes:()=>header('Trainer notes','Fictional demo notes · access control required in production')+'<div class="card"><label>Member</label><select id="nMember">'+demo.members.map(m=>'<option>'+m.name+'</option>').join('')+'</select><label>Progress note</label><textarea id="nText" rows="4" placeholder="Technique, progress, next-session adjustment"></textarea><button class="primary" onclick="addNote()">Save note</button></div><div class="card" style="margin-top:12px"><h3>Recent notes</h3>'+demo.notes.map(n=>'<div class="row"><b>'+n.member+'</b><span>'+n.text+'</span></div>').join('')+'</div>',
overview:()=>header('Owner overview','Membership and gym activity · illustrative figures')+'<div class="grid stats">'+stat('Membership revenue','₦655,000','Fictional sample')+stat('Active members',demo.members.filter(m=>m.status==='Active').length,'Demo roster')+stat('Renewals due','7','Illustrative')+stat('New registrations','12','Illustrative month')+'</div><div class="grid cols"><div class="card"><h3>Attendance trend</h3>'+[18,24,21,33,29,38,42].map((v,i)=>'<div class="row"><span>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]+'</span><span style="color:var(--green)">'+v+' visits</span></div>').join('')+'</div><div class="card"><h3>Peak hours</h3>'+['7 AM','8 AM','9 AM','5 PM','6 PM','7 PM'].map((v,i)=>'<div class="row">'+v+'<b>'+[18,34,62,46,78,55][i]+'%</b></div>').join('')+'</div></div>',
members:()=>header('Member management','Membership tiers, renewal dates and status')+table(demo.members.map(m=>[m.id,m.name,m.plan,m.trainer,m.expiry,m.status]),['ID','MEMBER','PLAN','TRAINER','RENEWAL','STATUS']),
attendance:()=>header('Attendance log','Shared events from member check-in simulation')+table(demo.attendance.map(a=>[a.name,a.day,a.time]),['MEMBER','DAY','TIME']),
finance:()=>header('Financial matrix','Fictional revenue and renewal schedule')+'<div class="grid stats">'+stat('Membership revenue','₦655,000','Sample month')+stat('Registration fees','₦60,000','Illustrative')+stat('Monthly fee','₦20,000','Reference pricing')+stat('Registration fee','₦5,000','Reference pricing')+'</div><div class="notice">These are illustrative demo figures, not reconciled gym accounts or payment records.</div>',
nutrition:()=>header('Nutrition hub','Meal logging · general wellness only')+'<div class="grid cols"><div class="card"><h3>Daily macro totals</h3>'+['Protein','Carbs','Fats','Calories'].map((k,i)=>'<div class="row">'+k+'<b>'+demo.meals.reduce((a,m)=>a+(m[['p','c','f','kcal'][i]]||0),0)+(i===3?' kcal':' g')+'</b></div>').join('')+'</div><div class="card"><h3>Log a meal</h3><label>Meal</label><input id="food" placeholder="Rice, beans and fish"><div class="formgrid"><div><label>Calories</label><input id="kcal" type="number"></div><div><label>Protein (g)</label><input id="protein" type="number"></div><div><label>Carbs (g)</label><input id="carbs" type="number"></div><div><label>Fats (g)</label><input id="fats" type="number"></div></div><button class="primary" onclick="addMeal()">Add meal</button></div></div><div class="notice">General wellness education only, not a prescribed diet or medical nutrition therapy.</div>',
wearables:()=>header('Wearable Sync Engine','Simulated metrics only · no device connected')+'<div class="notice">SIMULATED DATA — not a real watch connection, medical measurement or emergency monitor.</div><div class="grid stats">'+stat('Heart rate',demo.telemetry.hr+' BPM','Simulated')+stat('Steps',demo.telemetry.steps.toLocaleString(),'Simulated')+stat('Active calories',demo.telemetry.cal+' kcal','Simulated')+stat('Connection','Not connected','Local demo only')+'</div><button class="primary" onclick="simulate()">Generate sample reading</button>'
};
function checkin(){demo.attendance.unshift({name:'Amara James',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),day:'Today'});save();ping('Check-in recorded in shared demo log');render()}
function addRoutine(){let r={member:$('rMember').value,name:$('rName').value,exercise:$('rExercise').value,sets:$('rSets').value,rir:$('rRir').value};if(!r.name||!r.exercise||!r.sets)return ping('Complete routine name, exercise and sets/reps');demo.routines.unshift(r);save();render();ping('Routine saved')}
function addNote(){if(!$('nText').value.trim())return ping('Write a note first');demo.notes.unshift({member:$('nMember').value,text:$('nText').value.trim()});save();render();ping('Note saved')}
function addMeal(){let name=$('food').value.trim(),kcal=+$('kcal').value;if(!name||!kcal)return ping('Enter meal name and calories');demo.meals.push({name,kcal,p:+$('protein').value||0,c:+$('carbs').value||0,f:+$('fats').value||0});save();render();ping('Meal logged')}
function simulate(){demo.telemetry.hr=88+Math.floor(Math.random()*55);demo.telemetry.steps+=Math.floor(Math.random()*500);demo.telemetry.cal+=Math.floor(Math.random()*25);save();render()}
render();
</script></body></html>
